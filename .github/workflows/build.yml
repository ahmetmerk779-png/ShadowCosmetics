name: Build ShadowCosmetics

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build Fabric mod
        run: ./gradlew --no-daemon build

      - name: Verify and name mod JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t candidates < <(
            find build/libs -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-dev.jar' \
              ! -name '*-javadoc.jar' | sort
          )
          if [ "${#candidates[@]}" -ne 1 ]; then
            printf 'Expected one remapped mod JAR; found %s\n' "${#candidates[@]}"
            printf '%s\n' "${candidates[@]}"
            exit 1
          fi
          cp "${candidates[0]}" dist/ShadowCosmetics-1.21.11.jar
          test -s dist/ShadowCosmetics-1.21.11.jar
          jar tf dist/ShadowCosmetics-1.21.11.jar | grep -Fx 'fabric.mod.json'

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: ShadowCosmetics-1.21.11
          path: dist/ShadowCosmetics-1.21.11.jar
          if-no-files-found: error
          retention-days: 30
